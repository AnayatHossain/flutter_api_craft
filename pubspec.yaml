name: flutter_api_craft
description: "A comprehensive Flutter API client — all HTTP methods, auth types (Bearer, Basic, OAuth2, API Key, JWT), body types (JSON, form-data, GraphQL, binary), params, cookies, scripts, loading, snackbars, and navigation in one place."
version: 0.0.4
homepage: "https://github.com/AnayatHossain/flutter_api_craft"
repository: "https://github.com/AnayatHossain/flutter_api_craft"
issue_tracker: "https://github.com/AnayatHossain/flutter_api_craft/issues"

topics:
  - http
  - networking
  - api
  - rest
  - getx

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  get: ^4.6.6
  flutter_easyloading: ^3.0.5
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  http_mock_adapter: ^0.6.1
